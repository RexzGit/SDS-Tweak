name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: theos/sdks
          path: ios-sdk
      - name: Setup iOS Compiler
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Compile Dylib
        run: |
          SDK_PATH=$(ls -d ios-sdk/iPhoneOS1*.sdk | sort -V | tail -n 1)
          clang++ -target arm64-apple-ios14.0 -fuse-ld=lld -dynamiclib \
            -isysroot "$SDK_PATH" \
            -framework Foundation \
            -Wl,-undefined,dynamic_lookup \
            -x objective-c++ Tweak.xm \
            -o SDSTweak.dylib
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: SDSTweak.dylib
          path: SDSTweak.dylib
