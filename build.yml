name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Compile Dylib
        run: clang++ -dynamiclib -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=14.0 -framework Foundation -x objective-c++ Tweak.xm -o SDSTweak.dylib
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: SDSTweak.dylib
          path: SDSTweak.dylib
